layout: { qmk_keyboard: zsa/voyager }
draw_config:
  footer_text: ""
  svg_extra_style: |
    rect.key, rect.combo { fill: #313244; stroke: none; }
    rect.combo { fill: #1e1e2e; }
    rect.ghost { fill: #3132444D; }
    svg.keymap { background-color: #1e1e2e; }
    .layer-DEF text, .layer-DEF use, .layer-DEF rect.held { fill: #cfbd99; }
    .layer-NAV text, .layer-NAV use, .layer-NAV rect.held { fill: #89b4fa; }
    .layer-SYM text, .layer-SYM use, .layer-SYM rect.held { fill: #a6e3a1; }
    .layer-NUM text, .layer-NUM use, .layer-NUM rect.held { fill: #fab387; }
    text.held { fill: #1e1e2e; }
    rect.mod { fill: #181825; }
    text.label { visibility: hidden; }
    rect:has(~ a[href="#NAV"]) { stroke: #89b4fa; }
    rect:has(~ a[href="#SYM"]) { stroke: #a6e3a1; }
    rect:has(~ a[href="#NUM"]) { stroke: #fab387; }
    a { visibility: hidden; }
combos:
  - { p: [13, 14], k: $$mdi:keyboard-esc$$, l: [DEF] }
  - { p: [15, 16], k: $$mdi:arrow-bottom-left-bold-box$$, l: [DEF] }
  - { p: [26, 27], k: $$mdi:apple-keyboard-shift$$, l: [DEF] }
  - { p: [27, 28], k: $$mdi:apple-keyboard-control$$, l: [DEF] }
  - { p: [38, 39], k: "-", l: [DEF] }
  - { p: [39, 40], k: $$mdi:keyboard-tab$$, l: [DEF] }
  - { p: [19, 20], k: $$mdi:keyboard-return$$, l: [DEF] }
  - { p: [21, 22], k: $$mdi:sleep$$, l: [DEF] }
  - { p: [32, 33], k: $$mdi:apple-keyboard-shift$$, l: [DEF] }
  - { p: [31, 32], k: $$mdi:apple-keyboard-control$$, l: [DEF] }
  - { p: [43, 44], k: $$mdi:backspace$$, l: [DEF] }
  - { p: [44, 45], k: "/", l: [DEF] }
  - { p: [28, 31], k: $$mdi:file-word-box$$, l: [DEF] }
  
layers:
  DEF:
    - [{t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, Q, W, F, P, G, J, L, U, Y, { t: "'", s: '"' }, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, A, R, S, T, D, H, N, E, I, O, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, Z, X, C, V, B, K, M, {t: ",", s: ";"}, {t: ".", s: ":"}, { t: "?", s: "!" }, {t: "", type: "ghost"}]
    - [NAV, $$mdi:apple-keyboard-shift$$, $$mdi:keyboard-space$$, SYM]

  NAV:
    - [{t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, $$mdi:volume-minus$$, $$mdi:skip-backward$$, $$mdi:play-pause$$, $$mdi:skip-forward$$, $$mdi:volume-plus$$, $$mdi:arrow-collapse-down$$, $$mdi:arrow-collapse-left$$, $$mdi:arrow-collapse-right$$, $$mdi:arrow-collapse-up$$, $$mdi:caps-lock$$, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, { t: $$mdi:apple-keyboard-command$$, type: mod }, { t: $$mdi:apple-keyboard-option$$, type: mod }, { t: $$mdi:apple-keyboard-shift$$, type: mod }, { t: $$mdi:apple-keyboard-control$$, type: mod }, $$mdi:keyboard-tab$$, $$mdi:arrow-left$$, $$mdi:arrow-down$$, $$mdi:arrow-up$$, $$mdi:arrow-right$$, $$mdi:keyboard-esc$$, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, $$mdi:undo-variant$$, $$mdi:content-cut$$, $$mdi:content-copy$$, $$mdi:content-paste$$, $$mdi:repeat$$, $$mdi:backspace$$, $$mdi:backspace-outline$$, $$mdi:backspace-reverse-outline$$, $$mdi:printer-outline$$, $$mdi:menu$$, {t: "", type: "ghost"}]
    - [{ t: "", type: held }, $$mdi:apple-keyboard-shift$$, $$mdi:keyboard-space$$, NUM]

  SYM:
    - [{t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, '\', "|", "_", "&", "%", "+", "-", "=", "*", "/", {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, "<", ":", "{", "(", "[", "$", { t: $$mdi:apple-keyboard-control$$, type: mod }, { t: $$mdi:apple-keyboard-shift$$, type: mod }, { t: $$mdi:apple-keyboard-option$$, type: mod }, { t: $$mdi:apple-keyboard-command$$, type: mod }, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, ">", ";", "}", ")", "]", "€", "@", "#", "^", "~", {t: "", type: "ghost"}]
    - [{ t: ▽, type: trans }, NAV, { t: "", type: held }, { t: ▽, type: trans }]

  NUM:
    - [{t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, 1, 2, 3, 4, 5, 6, 7, 8, 9, 0, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, { t: $$mdi:apple-keyboard-command$$, type: mod }, { t: $$mdi:apple-keyboard-option$$, type: mod }, { t: $$mdi:apple-keyboard-shift$$, type: mod }, { t: $$mdi:apple-keyboard-control$$, type: mod }, F11, F12, { t: $$mdi:apple-keyboard-control$$, type: mod }, { t: $$mdi:apple-keyboard-shift$$, type: mod }, { t: $$mdi:apple-keyboard-option$$, type: mod }, { t: $$mdi:apple-keyboard-command$$, type: mod }, {t: "", type: "ghost"}]
    - [{t: "", type: "ghost"}, F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, {t: "", type: "ghost"}]
    - [{ t: "", type: held }, $$mdi:apple-keyboard-shift$$,  $$mdi:keyboard-space$$, {t: "", type: held}]