layout: { qmk_keyboard: zsa/voyager }
draw_config:
    footer_text: ""
    svg_extra_style: |
        rect.key, rect.combo { fill: #2b2b2b; stroke: none; }
        rect.combo { fill: #222222; }
        rect.ghost { fill: #1c1c1c; }
        svg.keymap { background-color: #121212; }
        .layer-DEF text, .layer-DEF use, .layer-DEF rect.held { fill: #FB9B60; }
        .layer-NAV text, .layer-NAV use, .layer-NAV rect.held { fill: #ff7364; }
        .layer-SYM text, .layer-SYM use, .layer-SYM rect.held { fill: #6f97d8; }
        .layer-NUM text, .layer-NUM use, .layer-NUM rect.held { fill: #E6C35A; }
        .layer-EXT text, .layer-EXT use, .layer-EXT rect.held { fill: #d95555; }
        rect:has(~ a[href="#EXT"]) { stroke: #d95555; stroke-dasharray: 20 30; stroke-dashoffset: 65; }
        text.held { fill: #1e1e1e; }
        rect.mod { fill: #181818; }
        text.label { visibility: hidden; }
        rect:has(~ a[href="#NAV"]) { stroke: #ff7364; }
        rect:has(~ a[href="#SYM"]) { stroke: #6f97d8; }
        rect:has(~ a[href="#NUM"]) { stroke: #FCD662; }
        a { visibility: hidden; }
combos:
    - { p: [13, 14], k: $$mdi:keyboard-esc$$, l: [DEF] }
    - { p: [15, 16], k: $$mdi:arrow-bottom-left-bold-outline$$, l: [DEF] }
    - { p: [26, 27], k: $$mdi:apple-keyboard-shift$$, l: [DEF] }
    - { p: [27, 28], k: $$mdi:apple-keyboard-control$$, l: [DEF] }
    - { p: [38, 39], k: { t: "-", s: "—" }, l: [DEF] }
    - { p: [39, 40], k: $$mdi:backspace-reverse-outline$$, l: [DEF] }
    - { p: [19, 20], k: $$mdi:keyboard-return$$, l: [DEF] }
    - { p: [20, 21], k: $$mdi:keyboard-tab$$, l: [DEF] }
    - { p: [32, 33], k: $$mdi:apple-keyboard-shift$$, l: [DEF] }
    - { p: [31, 32], k: $$mdi:apple-keyboard-control$$, l: [DEF] }
    - { p: [43, 44], k: $$mdi:backspace-outline$$, l: [DEF] }
    - { p: [44, 45], k: { t: "-", s: "/" }, l: [DEF] }
    - { p: [29, 30], k: $$mdi:file-word-box-outline$$, l: [DEF] }

layers:
    DEF:
        - [
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
          ]
        - [
              { t: "", type: "ghost" },
              Q,
              W,
              F,
              P,
              G,
              J,
              L,
              U,
              Y,
              { t: "'", s: '"' },
              { t: "", type: "ghost" },
          ]
        - [
              { t: "", type: "ghost" },
              A,
              R,
              S,
              T,
              D,
              H,
              N,
              E,
              I,
              O,
              { t: "", type: "ghost" },
          ]
        - [
              { t: "", type: "ghost" },
              Z,
              X,
              C,
              V,
              B,
              K,
              M,
              { t: ",", s: ";" },
              { t: ".", s: ":" },
              { t: "?", s: "!" },
              { t: "", type: "ghost" },
          ]
        - [$$mdi:apple-keyboard-shift$$, NAV, SYM, $$mdi:keyboard-space$$]

    NAV:
