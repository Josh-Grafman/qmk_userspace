              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
              { t: "", type: "ghost" },
          ]
